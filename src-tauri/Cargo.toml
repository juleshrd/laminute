[package]
name = "laminute"
version = "0.1.2"
description = "La Minute — application desktop"
authors = ["La Minute"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "laminute_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
mp3-duration = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
keyring = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
hound = "3.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
printpdf = "0.12"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[example]]
name = "bench_search"
path = "examples/bench_search.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[lints.clippy]
all = "warn"

# Profil release : taille et démarrage (voir docs/performance-budget.md).
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
