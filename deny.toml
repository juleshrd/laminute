[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0187", reason = "printpdf 0.7 épingle lopdf <0.42 ; mise à jour printpdf planifiée" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "OpenSSL",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
