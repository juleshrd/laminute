name: Install Tauri Linux dependencies
description: Installe les paquets apt requis pour compiler le backend Tauri, avec relance réseau bornée.

runs:
  using: composite
  steps:
    - name: Install Tauri Linux dependencies
      shell: bash
      run: |
        chmod +x .github/scripts/retry.sh
        .github/scripts/retry.sh 3 sudo apt-get update
        .github/scripts/retry.sh 3 sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libasound2-dev \
          patchelf
