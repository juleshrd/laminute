# Release GitHub : installateurs NSIS / DMG / AppImage + latest.json (updater).
#
# Déclenchement : tag v* (ex. git tag v0.1.0 && git push origin v0.1.0) ou workflow_dispatch.
#
# Secrets obligatoires (environnement GitHub `release`, ou secrets dépôt) :
#   TAURI_SIGNING_PRIVATE_KEY          — clé privée Minisign updater
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — mot de passe (chaîne vide si aucune)
#
# Secrets macOS optionnels (si tous présents : signature Developer ID + notarisation) :
#   APPLE_CERTIFICATE                  — certificat Developer ID Application (.p12, base64)
#   APPLE_CERTIFICATE_PASSWORD         — mot de passe du certificat
#   APPLE_ID / APPLE_PASSWORD          — compte Apple + mot de passe spécifique à l'app
#   APPLE_TEAM_ID                      — identifiant de l'équipe Apple Developer
#
# Avant chaque tag : aligner version dans package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_BODY: |
    ## La Minute

    ### Installateurs

    - **Windows** : fichier `.exe` (NSIS)
    - **macOS** : fichier `.dmg`
    - **Linux** : fichier `.AppImage`

    Les artefacts updater sont signés avec Minisign (vérifiés par l’application).
    Le DMG macOS est publié même sans identifiants Apple. Dans ce cas, il n’est ni signé
    Developer ID ni notarié et macOS affiche normalement un avertissement Gatekeeper.
    L’installateur Windows n’est pas signé avec Authenticode : un avertissement SmartScreen
    peut apparaître à la première exécution.

    Après installation, ouvrez **Réglages** et renseignez votre clé API (Mistral recommandé).

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - name: Vérifier tag, branche et versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/check-release-version.sh
          .github/scripts/check-release-version.sh

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      # Aligné sur ci.yml : cargo-deny via action (pas besoin de cargo install).
      - name: check (format, lint, tests, build)
        run: npm run check

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml
          arguments: --config deny.toml

      - name: npm audit (high severity)
        run: npm run audit:npm

  build:
    name: build-${{ matrix.platform }}
    needs: validate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Exiger la clé de signature updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY est obligatoire pour publier une release." >&2
            exit 1
          fi
        shell: bash

      - name: Déterminer le mode de distribution macOS
        id: apple_signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          present=0
          missing=()
          for secret_name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            else
              present=$((present + 1))
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::DMG macOS publié sans signature Developer ID ni notarisation."
            {
              echo "### Distribution macOS"
              echo "⚠️ Mode \`unsigned\` : avertissement Gatekeeper attendu."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$present" -ne 5 ]; then
            printf 'Secrets Apple partiels ; configuration refusée. Manquants : %s\n' "${missing[*]}" >&2
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=signed-notarized" >> "$GITHUB_OUTPUT"
            {
              echo "### Distribution macOS"
              echo "✅ Mode \`signed-notarized\` : contrôles Developer ID, Gatekeeper et stapler activés."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev patchelf

      - name: Install frontend dependencies
        shell: bash
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      # Ne pas injecter APPLE_* vides : Tauri tente alors un `security import` et échoue.
      - name: Build and publish
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: La Minute v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and publish (macOS notarié)
        if: matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: La Minute v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build and publish (macOS non signé)
        if: matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: La Minute v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Vérifier le bundle macOS signé et notarié
        if: matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$app_path" ] || [ -z "$dmg_path" ]; then
            echo "Bundle macOS ou DMG introuvable dans $bundle_dir" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -F "Authority=Developer ID Application"
          codesign -d --entitlements :- "$app_path" 2>/dev/null \
            | plutil -extract com.apple.security.device.audio-input raw -o - - \
            | grep -Fx "true"
          spctl --assess --type execute --verbose=4 "$app_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"

      - name: Signaler le bundle macOS non signé
        if: matrix.platform == 'macos-latest' && steps.apple_signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "DMG macOS introuvable dans $bundle_dir" >&2
            exit 1
          fi
          hdiutil verify "$dmg_path"
          echo "::warning file=$dmg_path::DMG non signé Developer ID et non notarié ; avertissement Gatekeeper attendu."

      - name: Signaler le statut Authenticode Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Installateur NSIS introuvable"
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -eq "Valid") {
            "### Distribution Windows`n✅ Signature Authenticode valide." | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Warning "Installateur Windows non signé avec Authenticode ; avertissement SmartScreen possible."
            "### Distribution Windows`n⚠️ Installateur non signé Authenticode ; avertissement SmartScreen possible." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Checksums des bundles
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle" ]; then
            bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          elif [ -d "src-tauri/target/release/bundle" ]; then
            bundle_dir="src-tauri/target/release/bundle"
          else
            echo "Aucun dossier bundle trouvé ; listing target :"
            find src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hash_cmd=(sha256sum)
          else
            hash_cmd=(shasum -a 256)
          fi
          mkdir -p release-meta
          : > "release-meta/SHA256SUMS-${{ matrix.platform }}.txt"
          while IFS= read -r -d '' f; do
            (
              cd "$(dirname "$f")"
              "${hash_cmd[@]}" "$(basename "$f")"
            ) >> "release-meta/SHA256SUMS-${{ matrix.platform }}.txt"
          done < <(find "$bundle_dir" -type f \( \
            -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.sig' \
          \) -print0 | sort -z)
          if [ ! -s "release-meta/SHA256SUMS-${{ matrix.platform }}.txt" ]; then
            echo "Aucun artefact bundle à checksumer dans $bundle_dir" >&2
            find "$bundle_dir" -type f | head -50 >&2 || true
            exit 1
          fi
          cp "release-meta/SHA256SUMS-${{ matrix.platform }}.txt" release-meta/SHA256SUMS.txt
          echo "Checksums :"
          cat release-meta/SHA256SUMS.txt

      - name: SBOM du crate
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: src-tauri
          format: spdx-json
          output-file: release-meta/sbom-${{ matrix.platform }}.spdx.json
          upload-artifact: false
          upload-release-attachments: false

      - name: Upload métadonnées release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta-${{ matrix.platform }}
          path: release-meta/
          if-no-files-found: error

      # Les attestations GitHub exigent un dépôt public (compte utilisateur).
      # continue-on-error tant que le repo est privé ; OK après passage public.
      - name: Attestation de provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.4.0 / v4.2.2
        with:
          subject-path: |
            release-meta/SHA256SUMS.txt
            release-meta/sbom-${{ matrix.platform }}.spdx.json

  publish-meta:
    name: publish-meta
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-meta-*
          merge-multiple: true
          path: release-meta

      - name: Joindre checksums et SBOM à la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          cat release-meta/SHA256SUMS-*.txt | sort > release-meta/SHA256SUMS.txt
          gh release upload "$TAG" \
            release-meta/SHA256SUMS.txt \
            release-meta/sbom-*.spdx.json \
            --clobber

      - name: Publier la release après validation de tous les bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          gh release edit "v${VERSION}" --draft=false
