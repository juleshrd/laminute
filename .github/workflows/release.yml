# Release GitHub : installateurs NSIS / DMG / AppImage + latest.json (updater).
#
# Déclenchement : tag v* (ex. git tag v0.1.0 && git push origin v0.1.0) ou workflow_dispatch.
#
# Secrets obligatoires pour signer les artefacts updater :
#   TAURI_SIGNING_PRIVATE_KEY          — contenu de la clé privée (jamais commitée)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — mot de passe (chaîne vide si aucune)
#
# Secrets optionnels (signature code OS — non bloquants si absents) :
#   macOS : APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#           APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Windows Authenticode : à brancher plus tard si un certificat est disponible
#
# Avant chaque tag : aligner version dans package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optionnels macOS (notarisation / signature Apple) — laisser vides si non configurés
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: La Minute v__VERSION__
          releaseBody: |
            Installateurs La Minute :

            - **Windows** : fichier `.exe` (NSIS)
            - **macOS** : fichier `.dmg`
            - **Linux** : fichier `.AppImage`

            Après installation, ouvrez **Réglages IA** et renseignez votre clé API Mistral (BYOK).

            Si macOS bloque l’ouverture (app non notariée) : clic droit → Ouvrir.
            Sous Windows, SmartScreen peut avertir si l’installateur n’est pas signé Authenticode.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
