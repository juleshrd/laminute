name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format_lint:
    name: format_lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      - run: npm run format:check
      - run: npm run lint

  test_frontend:
    name: test_frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      - run: npm run test:web

  test_rust:
    name: test_rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - run: npm run test:rust

      - name: Eval IA offline (JUL-199)
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --example eval_ai -- \
            --mode offline --corpus-dir eval --out-dir reports/eval

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      - run: npm run build

  size_budget:
    name: size_budget
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      - name: build web + binaire release
        run: |
          npm run build:web
          cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Vérifier budgets (docs/performance-budget.md)
        run: |
          set -euo pipefail
          MAX_BIN=$((45 * 1024 * 1024))
          MAX_DIST=$((3 * 1024 * 1024))
          BIN=src-tauri/target/release/laminute
          BIN_SIZE=$(stat -c '%s' "$BIN")
          DIST_SIZE=$(find dist -type f -print0 | xargs -0 stat -c '%s' | awk '{s+=$1} END {print s+0}')
          echo "Binaire release : $BIN_SIZE octets (max $MAX_BIN)"
          echo "Frontend dist/  : $DIST_SIZE octets (max $MAX_DIST)"
          {
            echo "## Budgets taille"
            echo ""
            echo "| Artefact | Taille | Seuil |"
            echo "| -------- | ------ | ----- |"
            echo "| binaire release | $BIN_SIZE | $MAX_BIN |"
            echo "| dist/ | $DIST_SIZE | $MAX_DIST |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BIN_SIZE" -gt "$MAX_BIN" ]; then
            echo "Budget binaire dépassé." >&2
            exit 1
          fi
          if [ "$DIST_SIZE" -gt "$MAX_DIST" ]; then
            echo "Budget dist/ dépassé." >&2
            exit 1
          fi

  audits:
    name: audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        run: |
          chmod +x .github/scripts/retry.sh
          .github/scripts/retry.sh 3 npm ci

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: src-tauri/Cargo.toml
          arguments: --config deny.toml

      - name: npm audit (high severity)
        run: npm run audit:npm

  e2e_smoke:
    name: e2e_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - uses: ./.github/actions/install-tauri-deps

      - name: Smoke E2E natif (JUL-204)
        run: |
          chmod +x e2e/smoke-linux.sh
          npm run test:e2e

  summary:
    name: summary
    if: always()
    needs:
      - format_lint
      - test_frontend
      - test_rust
      - build
      - size_budget
      - e2e_smoke
      - audits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Résumé produit vs infrastructure
        env:
          FORMAT_LINT: ${{ needs.format_lint.result }}
          TEST_FRONTEND: ${{ needs.test_frontend.result }}
          TEST_RUST: ${{ needs.test_rust.result }}
          BUILD: ${{ needs.build.result }}
          SIZE_BUDGET: ${{ needs.size_budget.result }}
          E2E_SMOKE: ${{ needs.e2e_smoke.result }}
          AUDITS: ${{ needs.audits.result }}
        run: |
          set -euo pipefail
          {
            echo "## Résumé CI"
            echo ""
            echo "| Job | Résultat | Classification |"
            echo "| --- | -------- | -------------- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed_product=0
          failed_infra=0

          classify() {
            local job="$1" result="$2" kind
            case "$result" in
              success)
                kind="ok"
                ;;
              cancelled|skipped)
                kind="infrastructure"
                failed_infra=1
                ;;
              failure)
                kind="produit"
                failed_product=1
                ;;
              *)
                kind="infrastructure"
                failed_infra=1
                ;;
            esac
            echo "| \`${job}\` | \`${result}\` | **${kind}** |" >> "$GITHUB_STEP_SUMMARY"
          }

          classify format_lint "$FORMAT_LINT"
          classify test_frontend "$TEST_FRONTEND"
          classify test_rust "$TEST_RUST"
          classify build "$BUILD"
          classify size_budget "$SIZE_BUDGET"
          classify e2e_smoke "$E2E_SMOKE"
          classify audits "$AUDITS"

          {
            echo ""
            if [ "$failed_product" -eq 0 ] && [ "$failed_infra" -eq 0 ]; then
              echo "✅ Tous les contrôles produit sont verts."
            elif [ "$failed_product" -eq 1 ]; then
              echo "❌ Échec **produit** : corriger le job rouge (format/lint, tests, build, budgets ou audits)."
            else
              echo "⚠️ Échec / annulation classé **infrastructure** (runner, concurrence PR, réseau)."
              echo "Relancer le job concerné ; ne pas traiter comme un défaut du code tant qu’aucun contrôle produit n’a échoué."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed_product" -eq 1 ]; then
            exit 1
          fi
          if [ "$failed_infra" -eq 1 ]; then
            exit 1
          fi
