name: Signalement de bug
description: Signaler un comportement incorrect ou inattendu
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de décrire le problème. Les informations ci-dessous nous aident à le reproduire.

  - type: input
    id: version
    attributes:
      label: Version
      description: Version de l'application (ex. 0.1.0) ou commit / tag
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options:
        - Linux
        - macOS
        - Windows
        - Autre
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s'est-il passé ? Qu'attendiez-vous ?
      placeholder: Décrivez le bug de façon claire et concise.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Liste numérotée des actions menant au problème
      placeholder: |
        1. Ouvrir l'application
        2. Cliquer sur « … »
        3. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Journaux / messages d'erreur
      description: Copiez-collez les messages de la console ou du terminal si disponibles
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Vérifications
      options:
        - label: J'ai cherché dans les issues existantes
          required: true
        - label: J'ai testé avec la dernière version disponible (main ou dernière release)
